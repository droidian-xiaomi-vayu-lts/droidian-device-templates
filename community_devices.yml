# Xiaomi vayu packages
.xiaomi_vayu_packages:
  packages: &xiaomi_vayu_packages
    - adaptation-droidian-xiaomi-vayu-lts-api30
    - adaptation-droidian-xiaomi-vayu-lts-api30-configs
    - linux-image-halium11-l4v3nx-xiaomi-vayu
    - linux-bootimage-halium11-l4v3nx-xiaomi-vayu
    - linux-headers-halium11-l4v3nx-xiaomi-vayu
    - flashlightd
    - libdroid-hal-lights
    - gstreamer1.0-gl
    - wl-clipboard
    - wlr-randr

# Xiaomi vayu image
xiaomi_vayu:
  type: image
  arch: arm64
  edition: phosh
  variant: phone
  apilevel: 30
  droidian_vg_name: droidian

  packages: *xiaomi_vayu_packages
  device_apt_pkgs: "
    apt-config-droidian-vayu-lts-current
    apt-keyrings-droidian-vayu-lts"
